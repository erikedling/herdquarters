<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Herdquarters</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="office.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span id="brand-name">Herdquarters</span>
    </div>
    <nav id="tabs" class="tabs"></nav>
    <div class="topbar-end">
      <div id="notice" class="notice" hidden></div>
      <button id="pets-btn" class="icon-btn topbar-btn" title="Hide or show the office animals">🐾</button>
      <button id="sidebar-btn" class="icon-btn topbar-btn" title="Toggle workspace sidebar">☰</button>
      <button id="settings-btn" class="icon-btn topbar-btn" title="Settings">⚙</button>
    </div>
  </header>

  <div id="settings" class="settings" hidden>
    <div class="settings-card" role="dialog" aria-label="Settings">
      <nav class="settings-nav">
        <div class="settings-title">Settings</div>
        <button class="settings-tab active" data-section="appearance">🎨 Appearance</button>
        <button class="settings-tab" data-section="assistant">🐦 <span class="assistant-name">PiPi</span></button>
        <button class="settings-tab" data-section="agents">🧑‍💼 Agents</button>
        <button class="settings-tab" data-section="general">⚙️ General</button>
        <div class="settings-foot"><button id="set-reset" class="btn small ghost">Reset to defaults</button></div>
      </nav>
      <div class="settings-main">
        <button id="set-close" class="icon-btn settings-close" title="Close (Esc)">✕</button>

        <section class="settings-section" data-section="appearance">
          <h3>Appearance</h3>
          <div class="settings-row">
            <span>Theme
              <span class="seg seg-inline">
                <label><input type="radio" name="mode" value="dark"> 🌙 Dark</label>
                <label><input type="radio" name="mode" value="light"> ☀️ Light</label>
                <label><input type="radio" name="mode" value="system"> System</label>
              </span>
            </span>
            <div id="set-themes" class="theme-grid"></div>
          </div>
          <label class="settings-row">
            <span>Office size <b id="set-scale-val"></b></span>
            <input id="set-scale" type="range" min="50" max="130" step="5">
          </label>
          <div class="settings-row">
            <span>Terminal
              <span class="seg seg-inline">
                <label><input type="radio" name="termLayout" value="split"> Split view</label>
                <label><input type="radio" name="termLayout" value="full"> Full window</label>
              </span>
            </span>
          </div>
          <label id="set-width-row" class="settings-row">
            <span>Split panel width <b id="set-width-val"></b></span>
            <!-- min/max match MIN_PCT/MAX_PCT in panel-drag.js -->
            <input id="set-width" type="range" min="30" max="75" step="1">
          </label>
          <label class="settings-row settings-check">
            <span class="settings-check-text">Office cats<small>A cat per room. It sits by whoever needs you and naps on a working desk.</small></span>
            <input id="set-cats" type="checkbox">
          </label>
          <label class="settings-row settings-check">
            <span class="settings-check-text">Office dogs<small>A dog per room. It cheers a finished desk, sits by whoever needs you and lies at a worker's feet.</small></span>
            <input id="set-dogs" type="checkbox">
          </label>
        </section>

        <section class="settings-section" data-section="assistant" hidden>
          <h3><span class="assistant-name">PiPi</span>, your assistant</h3>
          <label class="settings-row settings-check">
            <span class="settings-check-text">On<small>A bird that lives in the office and keeps track of what your agents and Slack need from you, sets reminders and remembers your work. Click it to chat. It runs as a headless Claude session and keeps its memory in the app's data folder.</small></span>
            <input id="set-assistant" type="checkbox">
          </label>
          <label class="settings-row settings-check">
            <span class="settings-check-text">Name<small>What the bird is called, in the office and in its own words. Empty goes back to PiPi.</small></span>
            <input id="set-assistant-name" type="text" maxlength="24" spellcheck="false" placeholder="PiPi">
          </label>
          <label class="settings-row settings-check">
            <span class="settings-check-text">Morning brief<small>On weekdays from this time it greets you with what needs you today, your meetings and reminders.</small></span>
            <input id="set-morning" type="time">
          </label>
        </section>

        <section class="settings-section" data-section="agents" hidden>
          <h3>Agents</h3>
          <label class="settings-row settings-check">
            <span class="settings-check-text">QA review<small>When a boss's tasks are done, a reviewer at a desk in its room checks readability and the repo's patterns. Fixes go back to the workers.</small></span>
            <input id="set-qa" type="checkbox">
          </label>
          <label class="settings-row settings-text">
            <span class="settings-check-text">Boss instructions<small>Added to every boss's brief, new and running. Running bosses read it at their next session; paste it in their terminal for an immediate effect.</small></span>
            <textarea id="set-instructions" rows="8" placeholder="e.g. Keep replies to me short and to the point, but say what is going on."></textarea>
          </label>
        </section>

        <section class="settings-section" data-section="general" hidden>
          <h3>General</h3>
          <div class="settings-row">
            <span>Workspace sidebar</span>
            <div class="seg">
              <label><input type="radio" name="sidebar" value="on"> Shown</label>
              <label><input type="radio" name="sidebar" value="off"> Hidden</label>
            </div>
          </div>
          <label class="settings-row settings-text">
            <span class="settings-check-text">Editor<small>Command that opens a folder: code, cursor, zed, subl, idea… Flags are fine (cursor -n). Used by “Open in editor”.</small></span>
            <input id="set-editor" type="text" spellcheck="false" placeholder="code">
          </label>
          <label class="settings-row settings-check">
            <span class="settings-check-text">Alert sound<small>A short chime when an ops agent raises an alert about a deploy.</small></span>
            <input id="set-alert-sound" type="checkbox">
          </label>
          <label class="settings-row settings-check">
            <span class="settings-check-text">Start herdr<small>When herdr is not running as the app opens, start it in the background. It keeps running after the app quits.</small></span>
            <input id="set-herdr-autostart" type="checkbox">
          </label>
          <div class="settings-row settings-check">
            <span class="settings-check-text">Welcome tour<small>The short tour from the first launch: the boss, the team and the helpers.</small></span>
            <button id="set-welcome" class="btn small" type="button">Show</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div id="alertbar" class="alertbar" role="alert" hidden></div>
  <div id="taskbar" class="taskbar" hidden></div>
  <div id="workspace" class="workspace">
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-title">Workspace</div>
      <div id="sidebar-tree" class="sidebar-tree"></div>
      <div id="sidebar-resizer" class="sidebar-resizer" title="Drag to resize, double-click to reset"></div>
    </nav>
    <main id="building" class="building"></main>
    <aside id="termpanel" class="termpanel" hidden>
      <div id="termpanel-resizer" class="termpanel-resizer" title="Drag to resize, double-click to reset"></div>
      <div class="termpanel-head">
        <span id="term-dot" class="dot idle"></span>
        <div class="termpanel-titles">
          <div id="term-title" class="termpanel-title">—</div>
          <div id="term-sub" class="termpanel-sub">—</div>
        </div>
        <button id="term-layout" class="termpanel-btn" title="Toggle split / full window">⤢</button>
        <button id="term-close" class="termpanel-btn" title="Close (Cmd+W)">✕</button>
      </div>
      <div id="term-host" class="term-host"></div>
      <div id="term-status" class="termpanel-status" hidden></div>
    </aside>
  </div>

  <footer id="reception" class="reception">
    <div class="reception-title">Reception</div>
    <div id="reception-list" class="reception-list"></div>
  </footer>

  <footer id="statusbar" class="statusbar">
    <div id="legend" class="legend">
      <span class="legend-item"><i class="dot working"></i>working</span>
      <span class="legend-item"><i class="dot blocked"></i>needs you</span>
      <span class="legend-item"><i class="dot blocked"></i>⚠ alert</span>
      <span class="legend-item"><i class="dot done"></i>done</span>
      <span class="legend-item"><i class="dot idle"></i>idle</span>
    </div>
    <div id="conn" class="conn">connecting…</div>
  </footer>

  <canvas id="bird-canvas" class="bird-canvas" aria-hidden="true"></canvas>
  <div id="bird" class="bird" title="Your assistant: click to chat, hold to pet, double-click for a flip" hidden></div>
  <div id="bird-bubble" class="bird-bubble" hidden></div>
  <button id="chat-tab" class="chat-tab" title="Chat with your assistant" hidden></button>
  <aside id="assistant-chat" class="chat" hidden>
    <header class="chat-head">
      <span class="chat-title assistant-name">PiPi</span>
      <span class="chat-status"></span>
      <button class="icon-btn chat-close" title="Close (Esc)">✕</button>
    </header>
    <div class="chat-log"></div>
    <form class="chat-form">
      <textarea rows="2" placeholder="Ask anything, or “remind me to…”" spellcheck="true"></textarea>
      <button class="btn primary" type="submit">Send</button>
    </form>
  </aside>
  <div id="tooltip" class="tooltip" tabindex="-1" hidden></div>
  <div id="ctxmenu" class="ctxmenu" hidden></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-error" class="modal-error" hidden></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn">Cancel</button>
        <button id="modal-ok" class="btn primary">OK</button>
      </div>
    </div>
  </div>

  <script src="errors.js"></script>
  <script src="themes.js"></script>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="summary.js"></script>
  <script src="figure.js"></script>
  <script src="figure-office.js"></script>
  <script src="animals.js"></script>
  <script src="view.js"></script>
  <script src="chat-format.js"></script>
  <script src="characters.js"></script>
  <script src="board.js"></script>
  <script src="term-select.js"></script>
  <script src="term-keys.js"></script>
  <script src="term-copy.js"></script>
  <script src="term-links.js"></script>
  <script src="panel-drag.js"></script>
  <script src="terminal.js"></script>
  <script src="sidebar-drag.js"></script>
  <script src="sidebar.js"></script>
  <script src="alerts.js"></script>
  <script src="slack.js"></script>
  <script src="pipi-sprite.js"></script>
  <script src="bird.js"></script>
  <script src="assistant.js"></script>
  <script src="app.js"></script>
  <script src="tabs.js"></script>
  <script src="settings.js"></script>
  <script src="scenes.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
